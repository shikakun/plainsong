[tools]
node = "26.11.1"
pnpm = "12.11.2"
lefthook = "2.2.1"

xcodegen = { version = "2.46.0", os = ["macos"] }
swiftformat = { version = "0.63.1", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
periphery = { version = "3.8.0", os = ["macos"] }

[tasks."macos:generate"]
description = "Generate plainsong.xcodeproj from project.yml"
dir = "apps/macos"
run = "xcodegen generate"

[tasks."macos:format"]
description = "Format all Swift source files"
dir = "apps/macos"
run = "swiftformat ."

[tasks."macos:lint"]
description = "Run SwiftFormat lint and SwiftLint"
dir = "apps/macos"
run = """
swiftformat --lint .
swiftlint lint --strict
"""

[tasks."macos:build"]
description = "Generate project and build the app"
dir = "apps/macos"
run = """
xcodegen generate
xcodebuild -scheme plainsong -project plainsong.xcodeproj build -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
"""

[tasks."macos:test"]
description = "Generate project and run unit tests"
dir = "apps/macos"
run = """
xcodegen generate
xcodebuild -scheme plainsong -project plainsong.xcodeproj test -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
"""

[tasks."macos:periphery"]
description = "Scan for unused code (requires prior build)"
dir = "apps/macos"
run = """
xcodegen generate
periphery scan
"""

[tasks."macos:build-signed"]
description = "Build a signed Release app for on-device verification"
dir = "apps/macos"
run = """
xcodegen generate
xcodebuild -scheme plainsong -project plainsong.xcodeproj \
  -configuration Release -destination 'platform=macOS' \
  -derivedDataPath build/dd \
  CONFIGURATION_BUILD_DIR="$(pwd)/build/Release" \
  -allowProvisioningUpdates build
echo "==> apps/macos/build/Release/Plainsong.app"
"""

[tasks."macos:bench"]
description = "Measure launch time, typing cost and memory of a Release build"
dir = "apps/macos"
# サンドボックスも含めて出荷時と同じ条件で測るため、entitlementsを付けてad-hoc署名する
# 計測するたびに保存した内容を消すので、本番のPlainsongとコンテナが分かれるようbundle IDを変える
run = """
xcodegen generate
xcodebuild -scheme plainsong -project plainsong.xcodeproj \
  -configuration Release -destination 'platform=macOS' \
  -derivedDataPath build/bench/dd \
  CONFIGURATION_BUILD_DIR="$(pwd)/build/bench/Release" \
  CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
  PRODUCT_BUNDLE_IDENTIFIER=com.shikakun.plainsong.bench \
  -quiet build
swiftc -O scripts/bench.swift -o build/bench/bench
build/bench/bench build/bench/Release/Plainsong.app ${BENCH_BASELINE:-}
"""

[tasks."macos:release"]
description = "Build and create a DMG (unsigned by default)"
dir = "apps/macos"
run = "bash scripts/release.sh"

[tasks."macos:ci"]
description = "Run the macOS app CI checks locally"
# buildとtestがそれぞれxcodegen generateを走らせるため、並列にすると.xcodeprojの書き換えが競合する
run = """
mise run macos:lint
mise run macos:build
mise run macos:test
"""

[tasks."web:install"]
description = "Install the website dependencies"
dir = "apps/web"
run = "pnpm install"

[tasks."web:dev"]
description = "Start the website dev server"
dir = "apps/web"
run = "pnpm dev"

[tasks."web:build"]
description = "Build the website"
dir = "apps/web"
run = "pnpm build"

[tasks."web:lint"]
description = "Run Biome and Markuplint"
dir = "apps/web"
run = "pnpm lint"

[tasks."web:typecheck"]
description = "Run astro check"
dir = "apps/web"
run = "pnpm typecheck"

[tasks."web:deploy"]
description = "Build and deploy the website to Cloudflare Workers"
dir = "apps/web"
run = """
pnpm build
pnpm exec wrangler deploy
"""

[tasks."web:ci"]
description = "Run the website CI checks locally"
run = """
mise run web:lint
mise run web:typecheck
mise run web:build
"""

[tasks.changeset]
description = "Add a changeset for the next release"
run = "pnpm changeset"

[tasks.ci]
description = "Run all CI checks locally"
run = """
mise run macos:ci
mise run web:ci
"""
